name: Build Acode APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: echo "dangerouslyAllowAllBuilds=true" >>.npmrc
      - name: Force SDK 35 + eruda www
        run: |
          sed -i 's/<preference name="android-compileSdkVersion".*//g' config.xml || true
          sed -i 's/<preference name="android-targetSdkVersion".*//g' config.xml || true
          sed -i 's/<\/widget>/ <preference name="android-compileSdkVersion" value="35" \/>\n <preference name="android-targetSdkVersion" value="35" \/>\n<\/widget>/g' config.xml
          curl -L https://cdn.jsdelivr.net/npm/eruda -o www/eruda.js
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run setup
      - name: Patch SDK + Inject Eruda en servidor 8158
        run: |
          cp www/eruda.js platforms/android/app/src/main/assets/www/eruda.js
          find platforms/android -type f -name "*.gradle" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 35/g' {} \;
          python3 /tmp/inject_server.py || true
          # Fallback final: modifica directamente el servidor httpd si existe
          find platforms/android -name "*.java" -exec sed -i 's|</body>|<script src="https://cdn.jsdelivr.net/npm/eruda"></script><script>eruda.init();</script></body>|g' {} \; || true
      - run: pnpm run build free d apk
      - uses: actions/upload-artifact@v4
        with:
          name: Acode-Eruda-8158-Fixed
          path: platforms/android/app/build/outputs/apk/debug/*.apk
