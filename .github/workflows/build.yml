name: Build Acode APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Force SDK 35 before setup
        run: |
          echo "dangerouslyAllowAllBuilds=true" >>.npmrc
          sed -i 's/<preference name="android-compileSdkVersion".*//g' config.xml || true
          sed -i 's/<preference name="android-targetSdkVersion".*//g' config.xml || true
          sed -i 's/<\/widget>/ <preference name="android-compileSdkVersion" value="35" \/>\n <preference name="android-targetSdkVersion" value="35" \/>\n<\/widget>/g' config.xml
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run setup
      - name: Install Android 35 and patch to 35
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true
          find platforms/android -type f -name "*.gradle" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 35/g; s/compileSdk 3./compileSdk 35/g; s/targetSdkVersion 3./targetSdkVersion 35/g; s/compileSdkVersion cdvCompileSdkVersion/compileSdkVersion 35/g' {} \;
          find platforms/android -type f -name "gradle.properties" -exec sed -i 's/cdvCompileSdkVersion=.*/cdvCompileSdkVersion=35/g; s/cdvTargetSdkVersion=.*/cdvTargetSdkVersion=35/g' {} \;
          grep -R "compileSdkVersion" platforms/android/app/build.gradle | head -n 5
      - run: pnpm run build free d apk
      - uses: actions/upload-artifact@v4
        with:
          name: Acode-Android13-fixed
          path: platforms/android/app/build/outputs/apk/debug/*.apk
