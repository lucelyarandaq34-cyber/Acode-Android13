name: Build Acode APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Fix pnpm + install SDK 34
        run: |
          echo "dangerouslyAllowAllBuilds=true" >>.npmrc
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platforms;android-33"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run setup
      - name: Patch compileSdk 34
        run: |
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/' platforms/android/app/build.gradle
          sed -i 's/compileSdk 33/compileSdk 34/g' platforms/android/app/build.gradle
          grep -n "compileSdk" platforms/android/app/build.gradle
      - run: pnpm run build free d apk
      - uses: actions/upload-artifact@v4
        with:
          name: Acode-Android13-fixed
          path: platforms/android/app/build/outputs/apk/debug/*.apk
