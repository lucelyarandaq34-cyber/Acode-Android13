name: Build Acode APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Fix pnpm + Force SDK 35 + Eruda
        run: |
          echo "dangerouslyAllowAllBuilds=true" >>.npmrc
          sed -i 's/<preference name="android-compileSdkVersion".*//g' config.xml || true
          sed -i 's/<preference name="android-targetSdkVersion".*//g' config.xml || true
          sed -i 's/<\/widget>/ <preference name="android-compileSdkVersion" value="35" \/>\n <preference name="android-targetSdkVersion" value="35" \/>\n<\/widget>/g' config.xml
          curl -L https://cdn.jsdelivr.net/npm/eruda -o www/eruda.js
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run setup
      - name: Patch to 35 + Inject Eruda
        run: |
          mkdir -p platforms/android/app/src/main/assets/www
          cp www/eruda.js platforms/android/app/src/main/assets/www/eruda.js
          find platforms/android -type f -name "*.gradle" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 35/g; s/compileSdk 3./compileSdk 35/g; s/targetSdkVersion 3./targetSdkVersion 35/g' {} \;
          find platforms/android -type f -name "gradle.properties" -exec sed -i 's/cdvCompileSdkVersion=.*/cdvCompileSdkVersion=35/g; s/cdvTargetSdkVersion=.*/cdvTargetSdkVersion=35/g' {} \;
          python3 /tmp/patch_eruda.py || true
      - run: pnpm run build free d apk
      - uses: actions/upload-artifact@v4
        with:
          name: Acode-Android13-Eruda
          path: platforms/android/app/build/outputs/apk/debug/*.apk
