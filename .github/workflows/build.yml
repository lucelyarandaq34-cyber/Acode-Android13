name: Build Acode APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install

      - name: Setup Cordova
        run: pnpm run setup

      - name: Build APK free dev
        run: pnpm run build free dev apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Acode-Android13-fixed
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
